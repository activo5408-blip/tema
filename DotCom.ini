[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,0

[Metadata]
Name=DotCom
Author=ChatGPT
Information=Panel compacto de CPU, RAM, red y espacio usado por unidad.
Version=1.0

[Variables]
W=310
H=490
Pad=16
Text=235,239,244
Muted=142,151,164
Accent=67,210,200
Panel=0,0,0,0
Line=49,55,64
Green=67,210,120
Red=255, 70, 70
Font=Segoe UI

; -------------------- MEDIDAS --------------------

[MeasureCPU]
Measure=CPU

[MeasureRAM]
Measure=PhysicalMemory
InvertMeasure=1

[MeasureNetIn]
Measure=NetIn

[MeasureNetOut]
Measure=NetOut

[MeasureC]
Measure=FreeDiskSpace
Drive=C:
Percent=1
InvertMeasure=1

[MeasureD]
Measure=FreeDiskSpace
Drive=D:
Percent=1
InvertMeasure=1

[MeasureE]
Measure=FreeDiskSpace
Drive=E:
Percent=1
InvertMeasure=1

[MeasureF]
Measure=FreeDiskSpace
Drive=F:
Percent=1
InvertMeasure=1

[MeasureG]
Measure=FreeDiskSpace
Drive=G:
Percent=1
InvertMeasure=1

[MeasureH]
Measure=FreeDiskSpace
Drive=H:
Percent=1
InvertMeasure=1

[MeasureCPUColor]
Measure=Calc
Formula=MeasureCPU
IfCondition=(MeasureCPU > 80)
IfTrueAction=[!SetOption MeterCPUValue FontColor "255,70,70"][!SetOption MeterCPUBar BarColor "255,70,70"][!UpdateMeter MeterCPUValue][!UpdateMeter MeterCPUBar]
IfFalseAction=[!SetOption MeterCPUValue FontColor "67,210,120"][!SetOption MeterCPUBar BarColor "67,210,120"][!UpdateMeter MeterCPUValue][!UpdateMeter MeterCPUBar]
IfConditionMode=1

[MeasureRAMColor]
Measure=Calc
Formula=MeasureRAM
IfCondition=(MeasureRAM > 80)
IfTrueAction=[!SetOption MeterRAMValue FontColor "255,70,70"][!SetOption MeterRAMBar BarColor "255,70,70"][!UpdateMeter MeterRAMValue][!UpdateMeter MeterRAMBar]
