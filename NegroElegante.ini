[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=15,17,21,245

[Metadata]
Name=Negro Elegante
Author=ChatGPT
Information=Panel compacto de CPU, RAM, red y espacio usado por unidad.
Version=1.0

[Variables]
W=310
H=490
Pad=16
Text=235,239,244
Muted=142,151,164
Accent=67,210,200
Panel=24,27,33
Line=49,55,64
Font=Segoe UI

; -------------------- MEDIDAS --------------------

[MeasureCPU]
Measure=CPU

[MeasureRAM]
Measure=PhysicalMemory
InvertMeasure=1

[MeasureNetIn]
Measure=NetIn

[MeasureNetOut]
Measure=NetOut

[MeasureC]
Measure=FreeDiskSpace
Drive=C:
Percent=1
InvertMeasure=1

[MeasureD]
Measure=FreeDiskSpace
Drive=D:
Percent=1
InvertMeasure=1

[MeasureE]
Measure=FreeDiskSpace
Drive=E:
Percent=1
InvertMeasure=1

[MeasureF]
